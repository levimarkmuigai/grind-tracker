[package]
name = "grind-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = {version = "0.8.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
thiserror = "2.0.19"
tokio = {version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
